name: Build CHAT PRO APK
on:
  push:
    branches: [ main, feature/email-only-registration, feature/calls-1.8.0, feature/chat-pro-four-improvements, feature/chat-pro-modern-ui-1.8.2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CHAT PRO server JavaScript
        run: |
          node --check server/src/index.js
          node --check server/src/db.js
      - name: Test CHAT PRO upload compatibility
        run: cd server && npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check whether release signing secrets are configured
        id: signing
        env:
          CHAT_PRO_KEYSTORE_BASE64: ${{ secrets.CHAT_PRO_KEYSTORE_BASE64 }}
          CHAT_PRO_STORE_PASSWORD: ${{ secrets.CHAT_PRO_STORE_PASSWORD }}
          CHAT_PRO_KEY_ALIAS: ${{ secrets.CHAT_PRO_KEY_ALIAS }}
          CHAT_PRO_KEY_PASSWORD: ${{ secrets.CHAT_PRO_KEY_PASSWORD }}
        run: |
          if [ -n "$CHAT_PRO_KEYSTORE_BASE64" ] && [ -n "$CHAT_PRO_STORE_PASSWORD" ] && [ -n "$CHAT_PRO_KEY_ALIAS" ] && [ -n "$CHAT_PRO_KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "$CHAT_PRO_KEYSTORE_BASE64" | base64 --decode > chat-pro-release.jks
            echo "CHAT_PRO_KEYSTORE_PATH=$GITHUB_WORKSPACE/chat-pro-release.jks" >> "$GITHUB_ENV"
            echo "CHAT_PRO_STORE_PASSWORD=$CHAT_PRO_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "CHAT_PRO_KEY_ALIAS=$CHAT_PRO_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "CHAT_PRO_KEY_PASSWORD=$CHAT_PRO_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured; building installable debug APK."
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: gradle --no-daemon assembleRelease
      - name: Verify APK signature
        if: steps.signing.outputs.available == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          apksigner verify --verbose "$APK"
      - name: Upload signed APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CHAT-PRO-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
      - name: Build debug APK without signing secrets
        if: steps.signing.outputs.available != 'true'
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CHAT-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
